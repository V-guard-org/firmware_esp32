# Em cada PR e no main: as regras e os testes do núcleo, os testes da ferramenta de bancada e a
# compilação do firmware e do simulador (proposta §4.8).
name: checagem

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checagem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache do PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Instalar o PlatformIO
        run: pip install platformio==6.2.0
      - name: Regras do núcleo
        run: python ferramentas/checa_nucleo.py
      - name: Testes do núcleo
        run: pio test -e native
      - name: Testes da ferramenta de bancada
        run: python -m unittest discover -s ferramentas
      - name: Compilar o firmware
        run: pio run -e esp32
      - name: Compilar o simulador
        run: pio run -e simulador
