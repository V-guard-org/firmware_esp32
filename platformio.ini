; firmware_esp32 (V-GUARD). A especificação está na proposta-de-desenvolvimento.md, §4 e §5.
;
;   pio run -e esp32 -t upload        o firmware
;   pio run -e esp32-sim -t upload    o firmware com a central simulada no lugar do MCP2515 (§4.7)
;   pio test -e native                os testes do núcleo (lib/nucleo/), no notebook

[platformio]
; O native não tem programa, só testes: pio run sem -e compila o firmware.
default_envs = esp32

[firmware]
; A versão que sai no $B e no cabeçalho do SD, seguida do commit (firmware_version.py).
; Cada ticket entregue sobe o 0.x.0 (proposta §4.8).
versao = 0.10.0

[esp32_base]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = coryjfowler/mcp_can@1.5.1
; O Arduino-ESP32 2.0.17 compila em C++11; o projeto usa C++17.
build_unflags = -std=gnu++11
; O mcp_can 1.5.1 vem com DEBUG_MODE 1 e escreve texto na serial ao iniciar o MCP2515: na USB,
; só podem sair as linhas do protocolo (proposta §5.5).
build_flags = -std=gnu++17 -DDEBUG_MODE=0
; Avisos só nas fontes do projeto, sem -Werror: o Arduino e o mcp_can geram avisos
; fora do nosso controle (CODING_STANDARDS.md).
build_src_flags = -Wall -Wextra
extra_scripts = post:firmware_version.py

; O firmware com o MCP2515, o do carro.
[env:esp32]
extends = esp32_base
build_src_filter = +<firmware/> -<firmware/can_simulado.cpp> -<firmware/acelerometro_simulado.cpp>

; O mesmo firmware com a central simulada no lugar do MCP2515 e, sem o ADXL345 no boot, o
; acelerômetro simulado, para a bancada sem o carro (proposta §4.7). A versão ganha -sim no fim,
; para os dados simulados não se confundirem com os do carro.
[env:esp32-sim]
extends = esp32_base
build_src_filter = +<firmware/> -<firmware/can_mcp2515.cpp> -<firmware/acelerometro_adxl345.cpp>
custom_versao_sufixo = -sim

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror
build_src_filter = -<*>
; Sem exceções e sem RTTI, para o notebook recusar o que o ESP32 não deve ter.
extra_scripts = pre:native_cxx.py
